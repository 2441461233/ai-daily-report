name: Daily AI report

on:
  # GitHub schedules use UTC. Avoid the top-of-hour congestion window.
  # The second run is an idempotent fallback if GitHub drops the first event.
  schedule:
    - cron: '17 2 * * *' # 10:17 Asia/Shanghai
    - cron: '47 2 * * *' # 10:47 Asia/Shanghai fallback
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-ai-report
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      copilot-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      collector_now: ${{ steps.prepare.outputs.collector_now }}
      report_date: ${{ steps.prepare.outputs.report_date }}
      priority_sha256: ${{ steps.prepare.outputs.priority_sha256 }}
      artificial_analysis_sha256: ${{ steps.prepare.outputs.artificial_analysis_sha256 }}
      artificial_analysis_changed_sha256: ${{ steps.prepare.outputs.artificial_analysis_changed_sha256 }}
      builders_sha256: ${{ steps.prepare.outputs.builders_sha256 }}
      waytoagi_sha256: ${{ steps.prepare.outputs.waytoagi_sha256 }}
      waytoagi_changed_sha256: ${{ steps.prepare.outputs.waytoagi_changed_sha256 }}
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Prepare deterministic research inputs
        id: prepare
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/daily-diagnostics"
          base_sha="$(git rev-parse HEAD)"
          collector_now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          report_date="$(TZ=Asia/Shanghai date --date="$collector_now" +%F)"
          node scripts/fetch_official_priority_sources.mjs --now "$collector_now" \
            > /tmp/priority-news.json \
            2> "$RUNNER_TEMP/daily-diagnostics/priority-source.log"
          test -s /tmp/priority-news.json
          printf '%s\n' "$report_date" > /tmp/report-date
          python3 scripts/validate_priority_coverage.py \
            --input /tmp/priority-news.json \
            --date "$report_date" \
            --now "$collector_now" \
            --input-only
          sha256sum /tmp/priority-news.json > /tmp/priority-news.json.sha256
          sha256sum /tmp/report-date >> /tmp/priority-news.json.sha256
          node scripts/fetch_artificial_analysis.mjs \
            --now "$collector_now" \
            --snapshot content/artificial-analysis-snapshot.json \
            --write-artifact \
            > /tmp/artificial-analysis.json \
            2> "$RUNNER_TEMP/daily-diagnostics/artificial-analysis.log"
          test -s /tmp/artificial-analysis.json
          git status --porcelain=v1 --untracked-files=all \
            | sed -nE 's/^.. (content\/artifacts\/artificial-analysis-[0-9]{8}-[0-9]{6}\.json)$/\1/p' \
            | sort > /tmp/artificial-analysis.changed
          python3 scripts/validate_artificial_analysis_run.py \
            --input /tmp/artificial-analysis.json \
            --changed-manifest /tmp/artificial-analysis.changed \
            --snapshot content/artificial-analysis-snapshot.json \
            --snapshot-role previous \
            --date "$report_date" \
            --now "$collector_now"
          sha256sum /tmp/artificial-analysis.json > /tmp/artificial-analysis.json.sha256
          sha256sum /tmp/artificial-analysis.changed >> /tmp/artificial-analysis.json.sha256
          node scripts/fetch_builders.mjs > /tmp/ai-builders.json
          sha256sum /tmp/ai-builders.json > /tmp/ai-builders.json.sha256
          # Keep the main report running when WayToAGI is unavailable, while
          # preserving a validated outage status and an empty change manifest.
          python3 scripts/waytoagi.py --write-artifacts --refresh-days 0 \
            --allow-source-unavailable \
            > /tmp/waytoagi.json
          sha256sum /tmp/waytoagi.json > /tmp/waytoagi.json.sha256
          git status --porcelain=v1 --untracked-files=all \
            | sed -nE 's/^.. (content\/artifacts\/waytoagi-[0-9]{8}\.json)$/\1/p' \
            | sort > /tmp/waytoagi.changed
          python3 scripts/validate_waytoagi_run.py \
            --input /tmp/waytoagi.json \
            --changed-manifest /tmp/waytoagi.changed
          sha256sum /tmp/waytoagi.changed >> /tmp/waytoagi.json.sha256
          priority_sha256="$(sha256sum /tmp/priority-news.json | cut -d ' ' -f 1)"
          artificial_analysis_sha256="$(sha256sum /tmp/artificial-analysis.json | cut -d ' ' -f 1)"
          artificial_analysis_changed_sha256="$(sha256sum /tmp/artificial-analysis.changed | cut -d ' ' -f 1)"
          builders_sha256="$(sha256sum /tmp/ai-builders.json | cut -d ' ' -f 1)"
          waytoagi_sha256="$(sha256sum /tmp/waytoagi.json | cut -d ' ' -f 1)"
          waytoagi_changed_sha256="$(sha256sum /tmp/waytoagi.changed | cut -d ' ' -f 1)"
          {
            printf 'base_sha=%s\n' "$base_sha"
            printf 'collector_now=%s\n' "$collector_now"
            printf 'report_date=%s\n' "$report_date"
            printf 'priority_sha256=%s\n' "$priority_sha256"
            printf 'artificial_analysis_sha256=%s\n' "$artificial_analysis_sha256"
            printf 'artificial_analysis_changed_sha256=%s\n' "$artificial_analysis_changed_sha256"
            printf 'builders_sha256=%s\n' "$builders_sha256"
            printf 'waytoagi_sha256=%s\n' "$waytoagi_sha256"
            printf 'waytoagi_changed_sha256=%s\n' "$waytoagi_changed_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Archive validated deterministic items
        run: |
          set -euo pipefail
          python3 scripts/build_fallback_report.py \
            --date "${{ steps.prepare.outputs.report_date }}" \
            --builders /tmp/ai-builders.json \
            --priority /tmp/priority-news.json \
            --waytoagi /tmp/waytoagi.json \
            --generated-at "${{ steps.prepare.outputs.collector_now }}" \
            --archive-only

      - name: Decide whether the Qwen editor is needed
        id: need_model
        run: |
          set -euo pipefail
          report_date="${{ steps.prepare.outputs.report_date }}"
          report_file="content/artifacts/${report_date}-1.json"
          coverage_log="$RUNNER_TEMP/daily-diagnostics/pre-model-priority-coverage.log"
          if [ ! -f "$report_file" ]; then
            required=true
            reason="today's main report is missing"
          elif python3 scripts/validate_priority_coverage.py \
            --input /tmp/priority-news.json \
            --date "$report_date" \
            --now "${{ steps.prepare.outputs.collector_now }}" \
            > "$coverage_log" 2>&1; then
            required=false
            reason="today's report already covers every required candidate"
          else
            required=true
            reason="a required priority candidate needs an addendum"
          fi
          printf 'required=%s\n' "$required" >> "$GITHUB_OUTPUT"
          printf 'Qwen editor required: %s (%s)\n' "$required" "$reason"

      - name: Prepare isolated Qwen workspace
        id: qwen_workspace
        if: steps.need_model.outputs.required == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          model_workspace="$RUNNER_TEMP/qwen-workspace"
          mkdir -p "$model_workspace"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            ./ "$model_workspace/"

      - name: Research and edit with Qwen3.7 Plus
        id: qwen
        if: >-
          steps.need_model.outputs.required == 'true' &&
          steps.qwen_workspace.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ runner.temp }}/qwen-workspace
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DAILY_REPORT_MODEL: qwen3.7-plus
          DAILY_REPORT_COST_CAP_CNY: '1.0'
        run: |
          set -euo pipefail
          {
            timeout --signal=TERM --kill-after=30s 35m \
              python3 scripts/generate_qwen_report.py \
              --date "${{ steps.prepare.outputs.report_date }}" \
              --generated-at "${{ steps.prepare.outputs.collector_now }}" \
              --builders /tmp/ai-builders.json \
              --priority /tmp/priority-news.json \
              --artificial-analysis /tmp/artificial-analysis.json \
              --waytoagi /tmp/waytoagi.json \
              --research-timeout 420 \
              --editor-timeout 420 \
              --diagnostics "$RUNNER_TEMP/daily-diagnostics/qwen-usage.json"
            unset DASHSCOPE_API_KEY
            python3 scripts/validate_content.py
            python3 scripts/validate_priority_coverage.py \
              --input /tmp/priority-news.json \
              --date "${{ steps.prepare.outputs.report_date }}" \
              --now "${{ steps.prepare.outputs.collector_now }}"
          } 2>&1 | tee "$RUNNER_TEMP/daily-diagnostics/qwen.log"

      - name: Preflight Qwen candidate
        id: qwen_preflight
        if: >-
          always() &&
          steps.need_model.outputs.required == 'true' &&
          steps.qwen.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          report_date="${{ steps.prepare.outputs.report_date }}"
          qwen_workspace="$RUNNER_TEMP/qwen-workspace"
          candidate_manifest="$RUNNER_TEMP/daily-diagnostics/qwen-candidate-manifest.txt"
          : > "$candidate_manifest"
          shopt -s nullglob
          for candidate in "$qwen_workspace/content/artifacts/${report_date}-"*.json; do
            if [ ! -f "$candidate" ] || [ -L "$candidate" ]; then
              echo "::error::Qwen output is not a regular artifact: $candidate"
              exit 1
            fi
            name="${candidate##*/}"
            if [[ ! "$name" =~ ^${report_date}-[1-9][0-9]*\.json$ ]]; then
              echo "::error::Unexpected Qwen artifact name: $name"
              exit 1
            fi
            target="content/artifacts/$name"
            if [ -e "$target" ]; then
              if ! cmp -s "$candidate" "$target"; then
                echo "::error::Qwen attempted to overwrite $target"
                exit 1
              fi
            else
              printf '%s\n' "$candidate" >> "$candidate_manifest"
            fi
          done
          if [ ! -s "$candidate_manifest" ]; then
            echo "::error::Qwen did not create a new same-day artifact."
            exit 1
          fi
          candidate_reported="$qwen_workspace/content/reported.md"
          if [ ! -f "$candidate_reported" ] || [ -L "$candidate_reported" ]; then
            echo "::error::Qwen did not leave a regular reported.md"
            exit 1
          fi
          python3 - content/reported.md "$candidate_reported" <<'PY'
          import sys
          from pathlib import Path

          original = Path(sys.argv[1]).read_bytes()
          candidate = Path(sys.argv[2]).read_bytes()
          if not candidate.startswith(original):
              raise SystemExit("Qwen changed the committed reported.md prefix")
          PY

      - name: Prepare isolated no-key fallback workspace
        id: fallback_workspace
        if: >-
          always() &&
          steps.need_model.outputs.required == 'true' &&
          (
            steps.qwen.outcome != 'success' ||
            steps.qwen_preflight.outcome != 'success'
          )
        continue-on-error: true
        run: |
          set -euo pipefail
          fallback_workspace="$RUNNER_TEMP/copilot-fallback-workspace"
          mkdir -p "$fallback_workspace" /tmp/copilot-cli
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            ./ "$fallback_workspace/"

      - name: Install pinned no-key fallback runner
        id: fallback_install
        if: always() && steps.fallback_workspace.outcome == 'success'
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=30s 8m npm install --global @github/copilot@1.0.80

      - name: Run the previous no-key research workflow
        id: fallback_agent
        if: >-
          always() &&
          steps.fallback_workspace.outcome == 'success' &&
          steps.fallback_install.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ runner.temp }}/copilot-fallback-workspace
        env:
          COPILOT_HOME: /tmp/copilot-cli
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_DATE: ${{ steps.prepare.outputs.report_date }}
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 45m copilot \
            --prompt "Read automation/AGENT_TASK.md completely and execute it now. The frozen Asia/Shanghai report date is ${REPORT_DATE}; /tmp/report-date is canonical even if the run crosses midnight. You must fully read /tmp/report-date, /tmp/priority-news.json, /tmp/artificial-analysis.json, /tmp/ai-builders.json, and /tmp/waytoagi.json before selecting or writing anything. If /tmp/waytoagi.json has sourceStatus.status=unavailable, continue the main report, do not refetch WayToAGI or modify its artifacts/state, and report the outage in the final run summary. Work autonomously, obey the file scope, cover every required priority candidate, preserve every deterministic attachment, finish all required artifact/archive writes, then report the concise run summary requested. The outer workflow will validate and build after you finish." \
            --allow-tool='read,write,url' \
            --allow-all-urls \
            --deny-tool='shell' \
            --excluded-tools='task,write_agent' \
            --no-ask-user \
            --no-auto-update \
            --no-color \
            --output-format=json \
            --share="$RUNNER_TEMP/daily-diagnostics/copilot-fallback-session.md" \
            2>&1 | tee "$RUNNER_TEMP/daily-diagnostics/copilot-fallback.jsonl"

      - name: Accept verified model output or publish a recovery edition
        id: accept
        if: always() && steps.need_model.outputs.required == 'true'
        env:
          QWEN_OUTCOME: ${{ steps.qwen.outcome }}
          QWEN_PREFLIGHT_OUTCOME: ${{ steps.qwen_preflight.outcome }}
          FALLBACK_AGENT_OUTCOME: ${{ steps.fallback_agent.outcome }}
        run: |
          set -euo pipefail
          report_date="${{ steps.prepare.outputs.report_date }}"
          qwen_workspace="$RUNNER_TEMP/qwen-workspace"
          fallback_workspace="$RUNNER_TEMP/copilot-fallback-workspace"
          new_manifest="/tmp/qwen-new-artifacts"
          : > "$new_manifest"

          collect_new_artifacts() {
            local workspace="$1"
            local candidate name target
            : > "$new_manifest"
            shopt -s nullglob
            for candidate in "$workspace/content/artifacts/${report_date}-"*.json; do
              if [ ! -f "$candidate" ] || [ -L "$candidate" ]; then
                echo "::error::Model output is not a regular artifact: $candidate"
                return 1
              fi
              name="${candidate##*/}"
              if [[ ! "$name" =~ ^${report_date}-[1-9][0-9]*\.json$ ]]; then
                echo "::error::Unexpected same-day artifact name: $name"
                return 1
              fi
              target="content/artifacts/$name"
              if [ -e "$target" ]; then
                if ! cmp -s "$candidate" "$target"; then
                  echo "::error::Model workflow attempted to overwrite $target"
                  return 1
                fi
              else
                printf '%s\n' "$candidate" >> "$new_manifest"
              fi
            done
            test -s "$new_manifest"
          }

          validate_reported_prefix() {
            local workspace="$1"
            local candidate="$workspace/content/reported.md"
            if [ ! -f "$candidate" ] || [ -L "$candidate" ]; then
              echo "::error::Model workflow did not leave a regular reported.md"
              return 1
            fi
            python3 - "content/reported.md" "$candidate" <<'PY'
          import sys
          from pathlib import Path

          original = Path(sys.argv[1]).read_bytes()
          candidate = Path(sys.argv[2]).read_bytes()
          if not candidate.startswith(original):
              raise SystemExit("model workflow changed the committed reported.md prefix")
          PY
          }

          validate_isolated_output() {
            local workspace="$1"
            (
              cd "$workspace"
              python3 scripts/validate_content.py
              python3 scripts/validate_priority_coverage.py \
                --input /tmp/priority-news.json \
                --date "$report_date" \
                --now "${{ steps.prepare.outputs.collector_now }}"
            )
          }

          accepted=false
          accepted_workspace=""
          accepted_route=""
          if [ "$QWEN_OUTCOME" = "success" ] \
            && [ "$QWEN_PREFLIGHT_OUTCOME" = "success" ] \
            && collect_new_artifacts "$qwen_workspace" \
            && validate_reported_prefix "$qwen_workspace" \
            && validate_isolated_output "$qwen_workspace"; then
            accepted_workspace="$qwen_workspace"
            accepted_route="Qwen3.7 Plus"
          elif [ "$FALLBACK_AGENT_OUTCOME" = "success" ] \
            && collect_new_artifacts "$fallback_workspace" \
            && validate_reported_prefix "$fallback_workspace" \
            && validate_isolated_output "$fallback_workspace"; then
            accepted_workspace="$fallback_workspace"
            accepted_route="previous no-key workflow"
          fi

          if [ -n "$accepted_workspace" ]; then
            while IFS= read -r candidate; do
              cp -- "$candidate" "content/artifacts/${candidate##*/}"
            done < "$new_manifest"
            cp -- "$accepted_workspace/content/reported.md" content/reported.md
            accepted=true
            printf 'Accepted %s verified artifact(s) from %s.\n' \
              "$(wc -l < "$new_manifest")" "$accepted_route"
          else
            echo "Qwen and the previous no-key workflow both failed; using the deterministic recovery edition."
          fi

          if [ ! -f "content/artifacts/${report_date}-1.json" ] \
            || [ "$accepted" != "true" ]; then
            python3 scripts/build_fallback_report.py \
              --date "$report_date" \
              --builders /tmp/ai-builders.json \
              --priority /tmp/priority-news.json \
              --waytoagi /tmp/waytoagi.json \
              --generated-at "${{ steps.prepare.outputs.collector_now }}"
          fi

          # Qwen may create a valid main/addendum; repair deterministic
          # WayToAGI archive lines from the frozen trusted input afterward.
          python3 scripts/build_fallback_report.py \
            --date "$report_date" \
            --builders /tmp/ai-builders.json \
            --priority /tmp/priority-news.json \
            --waytoagi /tmp/waytoagi.json \
            --generated-at "${{ steps.prepare.outputs.collector_now }}" \
            --archive-only

      - name: Re-run deterministic quality gates
        id: gates
        run: |
          set -euo pipefail
          {
            unexpected_changes="$RUNNER_TEMP/unexpected-model-changes.txt"
            : > "$unexpected_changes"
            while IFS= read -r -d '' changed_path; do
              case "$changed_path" in
                content/reported.md) ;;
                content/artifacts/*.json)
                  artifact_tail="${changed_path#content/artifacts/}"
                  if [[ "$artifact_tail" == */* ]]; then
                    printf '%s\n' "$changed_path" >> "$unexpected_changes"
                  fi
                  ;;
                *) printf '%s\n' "$changed_path" >> "$unexpected_changes" ;;
              esac
            done < <(git status --porcelain=v1 -z --untracked-files=all | while IFS= read -r -d '' entry; do
              status="${entry:0:2}"
              changed_path="${entry:3}"
              if [[ "$status" == *R* || "$status" == *C* ]]; then
                IFS= read -r -d '' rename_target || true
                printf '%s\0' "$changed_path" "$rename_target"
              else
                printf '%s\0' "$changed_path"
              fi
            done)
            if [ -s "$unexpected_changes" ]; then
              echo "::error::Model processing modified files outside the report allowlist:"
              sort -u "$unexpected_changes"
              exit 1
            fi

            verify_digest() {
              local input_path="$1"
              local expected="$2"
              local label="$3"
              local actual
              actual="$(sha256sum "$input_path" | cut -d ' ' -f 1)"
              if [ "$actual" != "$expected" ]; then
                echo "::error::${label} changed after the trusted prepare step."
                exit 1
              fi
            }
            verify_digest /tmp/priority-news.json \
              "${{ steps.prepare.outputs.priority_sha256 }}" "priority input"
            verify_digest /tmp/artificial-analysis.json \
              "${{ steps.prepare.outputs.artificial_analysis_sha256 }}" "Artificial Analysis input"
            verify_digest /tmp/artificial-analysis.changed \
              "${{ steps.prepare.outputs.artificial_analysis_changed_sha256 }}" "Artificial Analysis manifest"
            verify_digest /tmp/ai-builders.json \
              "${{ steps.prepare.outputs.builders_sha256 }}" "builders input"
            verify_digest /tmp/waytoagi.json \
              "${{ steps.prepare.outputs.waytoagi_sha256 }}" "WayToAGI input"
            verify_digest /tmp/waytoagi.changed \
              "${{ steps.prepare.outputs.waytoagi_changed_sha256 }}" "WayToAGI manifest"
            report_date="${{ steps.prepare.outputs.report_date }}"
            if [ "$(cat /tmp/report-date)" != "$report_date" ]; then
              echo "::error::Frozen report date changed after the trusted prepare step."
              exit 1
            fi
            python3 scripts/validate_priority_coverage.py \
              --input /tmp/priority-news.json \
              --date "$report_date" \
              --now "${{ steps.prepare.outputs.collector_now }}"
            python3 scripts/validate_artificial_analysis_run.py \
              --input /tmp/artificial-analysis.json \
              --changed-manifest /tmp/artificial-analysis.changed \
              --snapshot content/artificial-analysis-snapshot.json \
              --snapshot-role previous \
              --date "$report_date" \
              --now "${{ steps.prepare.outputs.collector_now }}"
            python3 scripts/validate_waytoagi_run.py \
              --input /tmp/waytoagi.json \
              --changed-manifest /tmp/waytoagi.changed
            python3 scripts/sync_waytoagi_state.py
            python3 scripts/sync_artificial_analysis_state.py \
              --input /tmp/artificial-analysis.json
            python3 scripts/validate_content.py
            npm run build
            python3 scripts/check_daily_changes.py --date "$report_date"
            mkdir -p "$RUNNER_TEMP/daily-evidence"
            cp /tmp/priority-news.json "$RUNNER_TEMP/daily-evidence/priority-news.json"
            cp /tmp/artificial-analysis.json "$RUNNER_TEMP/daily-evidence/artificial-analysis.json"
            cp /tmp/artificial-analysis.changed "$RUNNER_TEMP/daily-evidence/artificial-analysis.changed"
            cp /tmp/waytoagi.json "$RUNNER_TEMP/daily-evidence/waytoagi.json"
            cp /tmp/waytoagi.changed "$RUNNER_TEMP/daily-evidence/waytoagi.changed"
          } 2>&1 | tee "$RUNNER_TEMP/daily-diagnostics/quality-gates.log"

      - name: Package validated output
        uses: actions/upload-artifact@v7.0.1
        with:
          name: daily-output
          retention-days: 3
          if-no-files-found: error
          path: |
            content/artifacts
            content/reported.md
            content/artificial-analysis-snapshot.json
            content/waytoagi-consumed.txt
            public/data/reports.json

      - name: Package validated coverage evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: daily-evidence
          retention-days: 3
          if-no-files-found: error
          path: ${{ runner.temp }}/daily-evidence

      - name: Collect run diagnostics
        if: always()
        continue-on-error: true
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          NEED_MODEL: ${{ steps.need_model.outputs.required }}
          QWEN_WORKSPACE_OUTCOME: ${{ steps.qwen_workspace.outcome }}
          QWEN_OUTCOME: ${{ steps.qwen.outcome }}
          QWEN_PREFLIGHT_OUTCOME: ${{ steps.qwen_preflight.outcome }}
          FALLBACK_WORKSPACE_OUTCOME: ${{ steps.fallback_workspace.outcome }}
          FALLBACK_INSTALL_OUTCOME: ${{ steps.fallback_install.outcome }}
          FALLBACK_AGENT_OUTCOME: ${{ steps.fallback_agent.outcome }}
          ACCEPT_OUTCOME: ${{ steps.accept.outcome }}
          GATES_OUTCOME: ${{ steps.gates.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/daily-diagnostics"
          for source in \
            /tmp/priority-news.json \
            /tmp/priority-news.json.sha256 \
            /tmp/artificial-analysis.json \
            /tmp/artificial-analysis.json.sha256 \
            /tmp/artificial-analysis.changed \
            /tmp/report-date \
            /tmp/ai-builders.json \
            /tmp/ai-builders.json.sha256 \
            /tmp/waytoagi.json \
            /tmp/waytoagi.json.sha256 \
            /tmp/waytoagi.changed; do
            if [ -f "$source" ]; then
              cp "$source" "$RUNNER_TEMP/daily-diagnostics/"
            fi
          done
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'event_sha=%s\n' "$GITHUB_SHA"
            printf 'base_sha=%s\n' "${{ steps.prepare.outputs.base_sha }}"
            printf 'prepare=%s\n' "$PREPARE_OUTCOME"
            printf 'need_model=%s\n' "$NEED_MODEL"
            printf 'qwen_workspace=%s\n' "$QWEN_WORKSPACE_OUTCOME"
            printf 'qwen=%s\n' "$QWEN_OUTCOME"
            printf 'qwen_preflight=%s\n' "$QWEN_PREFLIGHT_OUTCOME"
            printf 'fallback_workspace=%s\n' "$FALLBACK_WORKSPACE_OUTCOME"
            printf 'fallback_install=%s\n' "$FALLBACK_INSTALL_OUTCOME"
            printf 'fallback_agent=%s\n' "$FALLBACK_AGENT_OUTCOME"
            printf 'accept_or_recover=%s\n' "$ACCEPT_OUTCOME"
            printf 'gates=%s\n' "$GATES_OUTCOME"
          } > "$RUNNER_TEMP/daily-diagnostics/manifest.txt"
          git status --porcelain=v1 --untracked-files=all \
            > "$RUNNER_TEMP/daily-diagnostics/git-status.txt"
          git diff --no-ext-diff > "$RUNNER_TEMP/daily-diagnostics/git-diff.patch"
          mkdir -p "$RUNNER_TEMP/daily-diagnostics/untracked-artifacts"
          git ls-files --others --exclude-standard 'content/artifacts/*.json' \
            | while IFS= read -r artifact; do
                cp "$artifact" "$RUNNER_TEMP/daily-diagnostics/untracked-artifacts/$(basename "$artifact")"
              done

      - name: Upload run diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: daily-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/daily-diagnostics

  commit:
    if: github.ref == 'refs/heads/main'
    needs: generate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.generate.outputs.base_sha }}
          fetch-depth: 0

      - name: Restore validated output
        uses: actions/download-artifact@v8.0.1
        with:
          name: daily-output
          path: .

      - name: Restore validated coverage evidence
        uses: actions/download-artifact@v8.0.1
        with:
          name: daily-evidence
          path: ${{ runner.temp }}/daily-evidence

      - name: Verify isolated output
        env:
          COLLECTOR_NOW: ${{ needs.generate.outputs.collector_now }}
          PRIORITY_SHA256: ${{ needs.generate.outputs.priority_sha256 }}
          ARTIFICIAL_ANALYSIS_SHA256: ${{ needs.generate.outputs.artificial_analysis_sha256 }}
          ARTIFICIAL_ANALYSIS_CHANGED_SHA256: ${{ needs.generate.outputs.artificial_analysis_changed_sha256 }}
          REPORT_DATE: ${{ needs.generate.outputs.report_date }}
          WAYTOAGI_SHA256: ${{ needs.generate.outputs.waytoagi_sha256 }}
          WAYTOAGI_CHANGED_SHA256: ${{ needs.generate.outputs.waytoagi_changed_sha256 }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/daily-evidence/priority-news.json"
          actual_sha256="$(sha256sum "$evidence" | cut -d ' ' -f 1)"
          if [ "$actual_sha256" != "$PRIORITY_SHA256" ]; then
            echo "::error::Restored priority evidence does not match the trusted prepare digest."
            exit 1
          fi
          artificial_analysis_input="$RUNNER_TEMP/daily-evidence/artificial-analysis.json"
          artificial_analysis_manifest="$RUNNER_TEMP/daily-evidence/artificial-analysis.changed"
          if [ "$(sha256sum "$artificial_analysis_input" | cut -d ' ' -f 1)" != "$ARTIFICIAL_ANALYSIS_SHA256" ]; then
            echo "::error::Restored Artificial Analysis evidence does not match the trusted prepare digest."
            exit 1
          fi
          if [ "$(sha256sum "$artificial_analysis_manifest" | cut -d ' ' -f 1)" != "$ARTIFICIAL_ANALYSIS_CHANGED_SHA256" ]; then
            echo "::error::Restored Artificial Analysis manifest does not match the trusted prepare digest."
            exit 1
          fi
          waytoagi_input="$RUNNER_TEMP/daily-evidence/waytoagi.json"
          waytoagi_manifest="$RUNNER_TEMP/daily-evidence/waytoagi.changed"
          if [ "$(sha256sum "$waytoagi_input" | cut -d ' ' -f 1)" != "$WAYTOAGI_SHA256" ]; then
            echo "::error::Restored WayToAGI evidence does not match the trusted prepare digest."
            exit 1
          fi
          if [ "$(sha256sum "$waytoagi_manifest" | cut -d ' ' -f 1)" != "$WAYTOAGI_CHANGED_SHA256" ]; then
            echo "::error::Restored WayToAGI manifest does not match the trusted prepare digest."
            exit 1
          fi
          python3 -m unittest discover -s tests
          node --test tests/fetch_official_priority_sources.test.mjs
          node --test tests/fetch_artificial_analysis.test.mjs
          python3 scripts/validate_priority_coverage.py \
            --input "$evidence" \
            --date "$REPORT_DATE" \
            --now "$COLLECTOR_NOW"
          python3 scripts/validate_artificial_analysis_run.py \
            --input "$artificial_analysis_input" \
            --changed-manifest "$artificial_analysis_manifest" \
            --snapshot content/artificial-analysis-snapshot.json \
            --snapshot-role current \
            --date "$REPORT_DATE" \
            --now "$COLLECTOR_NOW"
          python3 scripts/validate_waytoagi_run.py \
            --input "$waytoagi_input" \
            --changed-manifest "$waytoagi_manifest"
          python3 scripts/sync_waytoagi_state.py
          python3 scripts/sync_artificial_analysis_state.py \
            --input "$artificial_analysis_input"
          python3 scripts/validate_content.py
          python3 scripts/build_data.py
          python3 scripts/check_daily_changes.py --date "$REPORT_DATE"

      - name: Commit generated report
        env:
          REPORT_DATE: ${{ needs.generate.outputs.report_date }}
        run: |
          git add content/artifacts content/reported.md content/artificial-analysis-snapshot.json content/waytoagi-consumed.txt public/data/reports.json
          if git diff --cached --quiet; then
            echo "No report changes; this run was an idempotent no-op."
            exit 0
          fi
          git config user.name "ai-daily-report[bot]"
          git config user.email "2441461233+ai-daily-report[bot]@users.noreply.github.com"
          git commit -m "日报更新 ${REPORT_DATE}"
          git push origin HEAD:main
