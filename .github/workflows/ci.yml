name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: python3 scripts/validate_content.py

      - name: Lint
        run: npm run lint

      - name: Build production site
        run: npm run build

      - name: Ensure generated report data is committed
        run: git diff --exit-code -- public/data/reports.json
